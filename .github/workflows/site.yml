name: Site

on:
  pull_request:
    branches: [gh-pages]
  push:
    branches: [gh-pages]

permissions:
  contents: write

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run check
      # builds the site (the internal links are validated) and copies it to the branch root
      - run: npm run publish-site
      # GitHub Pages serves the branch root, so after a merge the root is
      # replaced with this build (pushes of this token don't start workflows)
      - name: Commit the published site
        if: github.event_name == 'push'
        run: |
          git add -A ..
          if git diff --cached --quiet; then
            echo "The published site is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: publish the site"
          git push
